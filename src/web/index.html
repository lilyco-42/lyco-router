<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyco 管理台</title>
<style>
  :root { --bg:#14161a; --card:#1c1f26; --line:#2a2f38; --fg:#e8eaed; --muted:#9aa0a6; --accent:#5dcaa5; --warn:#f0c98a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; padding:20px 16px 60px; background:var(--bg); color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;
    max-width:760px; margin-inline:auto; }
  h1 { font-size:21px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 8px; }
  h2 { font-size:16px; margin:26px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 14px; }
  .card .t { font-size:14px; font-weight:600; }
  .card .m { color:var(--muted); font-size:12px; margin-top:3px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .up { background:#123a2c; color:var(--accent); }
  .down { background:#3a2412; color:var(--warn); }
  .remote { background:#232a3a; color:#9db4e0; }
  form { background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input, select { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:#252932; color:var(--fg); font:inherit; font-size:14px; }
  button { margin-top:14px; padding:10px 18px; border-radius:9px; border:1px solid var(--line);
    background:#252932; color:var(--fg); font:inherit; cursor:pointer; }
  button:active { background:#2f3540; }
  .msg { margin-top:12px; font-size:13px; white-space:pre-wrap; }
  .ok { color:var(--accent); } .err { color:#f09595; }
</style>
</head>
<body>
  <h1>Lyco 管理台</h1>
  <p class="sub" id="sub">连接中…</p>

  <h2>服务</h2>
  <div class="grid" id="services"></div>

  <h2>工作流</h2>
  <div class="grid" id="workflows"></div>

  <h2>添加服务（用我自己的 AI）</h2>
  <form id="form">
    <label>类型</label>
    <select name="kind">
      <option value="llm">大模型（对话）</option>
      <option value="asr">语音识别</option>
      <option value="tts">语音合成</option>
      <option value="ocr">文字识别</option>
      <option value="rembg">抠图</option>
      <option value="download">下载</option>
      <option value="media">音视频处理</option>
      <option value="custom">其他</option>
    </select>
    <label>API 地址（填了就是远程服务；留空 = 本地引擎，端口自动分配）</label>
    <input name="url" placeholder="https://api.example.com/v1">
    <label>API 密钥（不写入文件，只提示存环境变量）</label>
    <input name="key" type="password" placeholder="sk-...">
    <label>名称（留空自动从域名派生）</label>
    <input name="name" placeholder="留空自动">
    <button type="submit">保存</button>
    <div class="msg" id="msg"></div>
  </form>

<script>
const $ = (s) => document.querySelector(s);
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load(){
  try {
    const r = await fetch('/api/services');
    const d = await r.json();
    $('#sub').textContent = '服务 ' + d.count + ' 个 · ' + location.host;
    $('#services').innerHTML = d.services.map(s => {
      const cls = s.state === 'up' ? 'up' : (s.state === 'remote' ? 'remote' : 'down');
      const label = s.state === 'up' ? '运行中' : (s.state === 'remote' ? '远程' : '休眠');
      return '<div class="card"><div class="t">' + esc(s.title || s.name) +
        '<span class="tag ' + cls + '">' + label + '</span></div>' +
        '<div class="m">' + esc(s.kind) + ' · ' + esc(s.mode) + '</div></div>';
    }).join('') || '<div class="m">还没有服务</div>';
  } catch(e){ $('#sub').textContent = '加载失败: ' + e; }

  try {
    const r = await fetch('/api/workflows');
    const d = await r.json();
    $('#workflows').innerHTML = d.workflows.map(w =>
      '<div class="card"><div class="t">' + esc(w.title || w.name) + '</div>' +
      '<div class="m">' + w.steps.length + ' 步</div></div>'
    ).join('') || '<div class="m">还没有工作流</div>';
  } catch(e){}
}

$('#form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = ev.target;
  const body = { kind: f.kind.value, url: f.url.value, key: f.key.value, name: f.name.value };
  const msg = $('#msg');
  msg.className = 'msg'; msg.textContent = '保存中…';
  try {
    const r = await fetch('/api/services', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'msg ok';
      msg.textContent = '已注册 ' + d.name + '（' + d.mode + '）' +
        (d.listen ? ' · 端口 ' + d.listen + '/' + d.backend : '') +
        (d.key_env ? '\n密钥请存环境变量: export ' + d.key_env + '=<你的key>' : '');
      f.url.value = ''; f.key.value = ''; f.name.value = '';
      load();
    } else {
      msg.className = 'msg err'; msg.textContent = '失败: ' + d.error;
    }
  } catch(e){ msg.className = 'msg err'; msg.textContent = '请求失败: ' + e; }
});

load();
</script>
</body>
</html>
